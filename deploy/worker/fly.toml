# Fly.io config for the Realy worker service (docs/deployment.md "Worker service").
#   fly launch --no-deploy --copy-config --config deploy/worker/fly.toml
#   fly secrets set --config deploy/worker/fly.toml DATABASE_URL=... REDIS_URL=... REALY_ENCRYPTION_KEY=... APP_URL=...
#   fly deploy --config deploy/worker/fly.toml       (run from the repository root; uses deploy/worker/Dockerfile)
# The worker has no HTTP service: no [http_service] section, and machines must never auto-stop.
app = "realy-worker"
primary_region = "fra"
kill_signal = "SIGTERM"
# Longer than WORKER_SHUTDOWN_TIMEOUT_MS so running jobs drain on deploys.
kill_timeout = "60s"

[build]
  dockerfile = "deploy/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  REALY_SERVICE = "worker"
  WORKER_SHUTDOWN_TIMEOUT_MS = "45000"

[processes]
  worker = "node_modules/.bin/tsx src/worker/index.ts"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "1gb"
